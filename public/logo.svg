<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon - Network Tree -->
  <g transform="translate(8, 10)">
    <!-- Top center node -->
    <circle cx="16" cy="6" r="3.5" fill="#6366F1" stroke="#6366F1" stroke-width="1"/>
    
    <!-- Vertical line from top -->
    <line x1="16" y1="9.5" x2="16" y2="14" stroke="#6366F1" stroke-width="1.5"/>
    
    <!-- Left branch -->
    <line x1="16" y1="14" x2="5" y2="18" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="5" cy="21" r="2.5" fill="#818CF8" stroke="#818CF8" stroke-width="1"/>
    
    <!-- Center branch -->
    <line x1="16" y1="14" x2="16" y2="19" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="16" cy="22" r="2.5" fill="#818CF8" stroke="#818CF8" stroke-width="1"/>
    
    <!-- Right branch -->
    <line x1="16" y1="14" x2="27" y2="18" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="27" cy="21" r="2.5" fill="#818CF8" stroke="#818CF8" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1F2937">MenuCraft</text>
  <text x="50" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9CA3AF" letter-spacing="1">MEGA MENU BUILDER</text>
</svg>
